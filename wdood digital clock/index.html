<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Digital Clock</title>
<script src="./app.js" defer></script>
<link rel="stylesheet" href="./styles.css">
</head>

<body>

<div class="clock-box">
    <div class="time">
        <span id="hour">12</span>
        <span class="colon">:</span>
        <span id="minute">00</span>
        <span class="colon">:</span>
        <span id="second" class="seconds">00</span>
        <span id="ampm" class="ampm">AM</span>
    </div>
    <div class="footer">TIMER CHANNEL</div>
</div>
</body>
</html>
